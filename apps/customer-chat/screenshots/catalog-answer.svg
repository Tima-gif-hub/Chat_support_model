<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Catalog answer with two citations</title><desc id="d">Synthetic support chat with a grounded furniture answer and two sources.</desc><rect width="1200" height="720" fill="#f3efe7"/><rect x="24" y="20" width="1152" height="680" rx="18" fill="#fffdf8"/><path d="M24 38a18 18 0 0 1 18-18h350v680H42a18 18 0 0 1-18-18Z" fill="#1c2b27"/><text x="58" y="74" font-family="Arial" font-size="14" font-weight="700" fill="#f8f4ec">Anonymous Furniture Company</text><text x="58" y="176" font-family="Arial" font-size="12" font-weight="700" fill="#bfcfc7">CUSTOMER SUPPORT</text><text x="58" y="232" font-family="Georgia" font-size="46" fill="#fff">How can</text><text x="58" y="282" font-family="Georgia" font-size="46" fill="#fff">we help?</text><text x="430" y="62" font-family="Arial" font-size="15" font-weight="700" fill="#1c2b27">Support assistant</text><line x1="392" y1="98" x2="1176" y2="98" stroke="#cfc7ba"/><rect x="690" y="145" width="440" height="76" rx="14" fill="#e8e1d5"/><text x="715" y="174" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">YOU</text><text x="715" y="199" font-family="Arial" font-size="15" fill="#1c2b27">Is the Alder table solid wood, and how should I care for it?</text><text x="438" y="278" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">SUPPORT ASSISTANT</text><text x="438" y="314" font-family="Arial" font-size="16" fill="#1c2b27">The Alder dining table uses a solid oak top with an oak-veneered</text><text x="438" y="339" font-family="Arial" font-size="16" fill="#1c2b27">support panel. Wipe spills promptly with a soft, damp cloth.</text><rect x="438" y="382" width="164" height="31" rx="16" fill="#e4eee7" stroke="#b5c9bb"/><text x="454" y="402" font-family="Arial" font-size="12" font-weight="700" fill="#173f35">S1 · Alder dining table</text><rect x="612" y="382" width="176" height="31" rx="16" fill="#e4eee7" stroke="#b5c9bb"/><text x="628" y="402" font-family="Arial" font-size="12" font-weight="700" fill="#173f35">S2 · Wood furniture care</text><line x1="392" y1="576" x2="1176" y2="576" stroke="#cfc7ba"/><rect x="430" y="610" width="708" height="54" rx="11" fill="#fff" stroke="#9eaaa5"/></svg>
