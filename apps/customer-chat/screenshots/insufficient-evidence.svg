<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Insufficient-evidence abstention</title><desc id="d">Synthetic support chat showing an honest abstention.</desc><rect width="1200" height="720" fill="#f3efe7"/><rect x="24" y="20" width="1152" height="680" rx="18" fill="#fffdf8"/><rect x="24" y="20" width="368" height="680" rx="18" fill="#1c2b27"/><text x="58" y="74" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Anonymous Furniture Company</text><text x="58" y="210" font-family="Georgia" font-size="44" fill="#fff">Verified,</text><text x="58" y="258" font-family="Georgia" font-size="44" fill="#fff">or clearly not.</text><text x="430" y="62" font-family="Arial" font-size="15" font-weight="700" fill="#1c2b27">Support assistant</text><line x1="392" y1="98" x2="1176" y2="98" stroke="#cfc7ba"/><rect x="650" y="145" width="480" height="76" rx="14" fill="#e8e1d5"/><text x="675" y="175" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">YOU</text><text x="675" y="200" font-family="Arial" font-size="15" fill="#1c2b27">Will the Alder table be available in walnut next spring?</text><text x="438" y="278" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">SUPPORT ASSISTANT</text><text x="438" y="314" font-family="Arial" font-size="16" fill="#1c2b27">I cannot verify a future walnut option from current company information.</text><text x="438" y="339" font-family="Arial" font-size="16" fill="#1c2b27">Availability should not be assumed until it is published.</text><rect x="438" y="378" width="664" height="106" rx="14" fill="#f5dfbe"/><text x="458" y="409" font-family="Georgia" font-size="20" fill="#1c2b27">Information not verified</text><text x="458" y="440" font-family="Arial" font-size="14" fill="#55615d">No current source supports this option or future availability.</text></svg>
