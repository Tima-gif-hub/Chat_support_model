<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Degraded response</title><desc id="d">Synthetic support chat showing a retryable knowledge-service failure.</desc><rect width="1200" height="720" fill="#f3efe7"/><rect x="24" y="20" width="1152" height="680" rx="18" fill="#fffdf8"/><rect x="24" y="20" width="368" height="680" rx="18" fill="#1c2b27"/><text x="58" y="74" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Anonymous Furniture Company</text><text x="58" y="210" font-family="Georgia" font-size="44" fill="#fff">Clear when</text><text x="58" y="258" font-family="Georgia" font-size="44" fill="#fff">things fail.</text><text x="430" y="62" font-family="Arial" font-size="15" font-weight="700" fill="#1c2b27">Support assistant</text><line x1="392" y1="98" x2="1176" y2="98" stroke="#cfc7ba"/><rect x="650" y="145" width="480" height="76" rx="14" fill="#e8e1d5"/><text x="675" y="175" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">YOU</text><text x="675" y="200" font-family="Arial" font-size="15" fill="#1c2b27">What is the delivery charge to North District?</text><text x="438" y="278" font-family="Arial" font-size="13" font-weight="700" fill="#55615d">SUPPORT ASSISTANT</text><text x="438" y="314" font-family="Arial" font-size="16" fill="#1c2b27">Company information is temporarily unavailable, so I cannot verify it.</text><rect x="438" y="357" width="664" height="148" rx="14" fill="#f6dfdc"/><text x="458" y="391" font-family="Georgia" font-size="21" fill="#621d1a">Company information unavailable</text><text x="458" y="423" font-family="Arial" font-size="14" fill="#621d1a">The knowledge service did not respond. No answer was inferred.</text><rect x="458" y="447" width="78" height="40" rx="9" fill="#1f5a49"/><text x="478" y="472" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Retry</text></svg>
