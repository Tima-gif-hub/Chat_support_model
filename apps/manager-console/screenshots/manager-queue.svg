<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Manager complaint queue</title><desc id="d">Synthetic manager console with complaint filters, actions, consent source, and audit history.</desc><rect width="1400" height="820" fill="#f2eee6"/><text x="44" y="48" font-family="Arial" font-size="14" font-weight="700" fill="#1b2926">Anonymous Furniture Company</text><text x="1190" y="48" font-family="Arial" font-size="12" fill="#59635f">MANAGER CONSOLE</text><line x1="0" y1="70" x2="1400" y2="70" stroke="#cec6b9"/><text x="44" y="132" font-family="Arial" font-size="11" font-weight="700" fill="#1f5a49">COMPLAINT OPERATIONS</text><text x="44" y="201" font-family="Georgia" font-size="62" fill="#1b2926">Manager queue</text><text x="44" y="232" font-family="Arial" font-size="15" fill="#59635f">Review consented complaints, record internal context, and close the loop.</text><text x="1120" y="180" font-family="Arial" font-size="11" fill="#59635f">OPEN</text><text x="1120" y="215" font-family="Georgia" font-size="28" fill="#1b2926">3</text><rect x="32" y="268" width="1336" height="82" rx="14" fill="#1b2926"/><rect x="50" y="296" width="560" height="40" rx="8" fill="#fffdf8"/><text x="66" y="321" font-family="Arial" font-size="13" fill="#68736f">Reference or conversation text</text><rect x="630" y="296" width="220" height="40" rx="8" fill="#fffdf8"/><text x="646" y="321" font-family="Arial" font-size="13" fill="#1b2926">Open</text><rect x="32" y="350" width="1336" height="440" fill="#fffdf8"/><line x1="532" y1="350" x2="532" y2="790" stroke="#cec6b9"/><rect x="32" y="350" width="500" height="40" fill="#e9e3d9"/><text x="50" y="376" font-family="Arial" font-size="11" font-weight="700" fill="#59635f">PRIORITY ORDER</text><rect x="32" y="390" width="500" height="108" fill="#dce7de"/><text x="50" y="420" font-family="Arial" font-size="14" font-weight="700" fill="#1b2926">Delivery Damage</text><text x="50" y="450" font-family="Arial" font-size="12" fill="#59635f">The dresser arrived with a cracked drawer front.</text><rect x="50" y="465" width="62" height="21" rx="11" fill="#f2ddbd"/><text x="62" y="479" font-family="Arial" font-size="9" font-weight="700" fill="#7b481a">QUEUED</text><text x="50" y="534" font-family="Arial" font-size="14" font-weight="700" fill="#1b2926">Missing Item or Part</text><text x="50" y="562" font-family="Arial" font-size="12" fill="#59635f">The wardrobe package is missing the rail and fittings bag.</text><text x="570" y="410" font-family="Georgia" font-size="33" fill="#1b2926">Delivery Damage</text><text x="570" y="438" font-family="Arial" font-size="12" fill="#59635f">cmp_01J8N4K2D7Q9 · 12 Sep 2026, 08:18 UTC</text><rect x="1112" y="388" width="110" height="40" rx="9" fill="#1f5a49"/><text x="1130" y="413" font-family="Arial" font-size="12" font-weight="700" fill="#fff">Acknowledge</text><rect x="1232" y="388" width="110" height="40" rx="9" fill="none" stroke="#1f5a49"/><text x="1248" y="413" font-family="Arial" font-size="12" font-weight="700" fill="#1f5a49">Mark resolved</text><line x1="570" y1="466" x2="1342" y2="466" stroke="#cec6b9"/><text x="570" y="500" font-family="Arial" font-size="10" font-weight="700" fill="#59635f">STATUS</text><text x="570" y="523" font-family="Arial" font-size="13" fill="#1b2926">Queued</text><text x="820" y="500" font-family="Arial" font-size="10" font-weight="700" fill="#59635f">CONSENT SOURCE</text><text x="820" y="523" font-family="Arial" font-size="13" fill="#1b2926">Explicit request</text><text x="570" y="570" font-family="Arial" font-size="11" font-weight="700" fill="#1b2926">CONVERSATION EXCERPT</text><rect x="570" y="585" width="772" height="66" rx="12" fill="#f2eee6"/><text x="590" y="612" font-family="Arial" font-size="13" fill="#1b2926">“The dresser arrived with a cracked drawer front.</text><text x="590" y="634" font-family="Arial" font-size="13" fill="#1b2926">Please report the damage to a m