[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "furniture-support-ai"
version = "0.1.0"
description = "Public anonymized customer-support assistant portfolio implementation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "components/01-model-preparation/tests",
  "components/02-model-serving/tests",
  "components/03-rag-platform/tests",
  "components/04-support-runtime/tests",
  "apps/customer-chat/tests",
  "apps/manager-console/tests",
]
pythonpath = [
  ".",
  "packages/python-contracts",
  "components/01-model-preparation/src",
  "components/02-model-serving/src",
  "components/03-rag-platform/src",
  "components/04-support-runtime/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
