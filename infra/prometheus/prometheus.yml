global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yaml
scrape_configs:
  - job_name: rag-platform
    metrics_path: /metrics
    static_configs: [{targets: [rag-api:8080]}]
  - job_name: model-serving
    metrics_path: /metrics
    static_configs: [{targets: [model-mock:8000]}]
  - job_name: runtime
    metrics_path: /metrics
    static_configs: [{targets: [runtime-api:8000]}]
  - job_name: otel-collector
    static_configs: [{targets: [otel-collector:9464]}]
