name: model-serving

on:
  pull_request:
    paths:
      - "components/02-model-serving/**"
      - "packages/python-contracts/**"
      - "contracts/model.openapi.yaml"
      - "contracts/model-manifest.schema.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/model-serving.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m ruff check components/02-model-serving/src components/02-model-serving/tests
      - name: Typecheck model-serving implementation
        run: python -m mypy components/02-model-serving/src --ignore-missing-imports --disable-error-code=return-value
      - run: python -m compileall components/02-model-serving
      - run: python -m pytest components/02-model-serving/tests -q
      - run: docker build -t model-serving:${{ github.sha }} components/02-model-serving
