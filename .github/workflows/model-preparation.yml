name: model-preparation

on:
  pull_request:
    paths:
      - "components/01-model-preparation/**"
      - "packages/python-contracts/**"
      - "contracts/decision.schema.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/model-preparation.yml"
  workflow_dispatch:
    inputs:
      run_name:
        description: "GPU dry-run name"
        required: false
        default: "manual"

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check components/01-model-preparation/src components/01-model-preparation/scripts components/01-model-preparation/tests
      - run: python -m mypy components/01-model-preparation/src --ignore-missing-imports --follow-imports=skip
      - run: python -m compileall components/01-model-preparation packages/python-contracts
      - run: python -m pytest components/01-model-preparation/tests -q
      - run: python components/01-model-preparation/scripts/run_pipeline.py --fixture-check
  gpu-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python components/01-model-preparation/scripts/gpu_dry_run.py --run-name "${{ inputs.run_name }}"
